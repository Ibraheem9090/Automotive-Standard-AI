name: Daily Standards Sync

on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 2:00 AM UTC
  workflow_dispatch:

# Give workflow write permissions to commit changes back to repo
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Standards Sync Scraper
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python scraper_sync.py

      # Commit and push downloaded PDFs back to the repo
      - name: Commit and Push Downloaded PDFs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): sync newly crawled PDFs to pdf_store"
          file_pattern: "pdf_store/*.pdf"