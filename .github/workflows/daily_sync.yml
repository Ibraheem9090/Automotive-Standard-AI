name: Daily Automotive Standards Sync

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at 00:00 UTC
  workflow_dispatch:      # Allows manual trigger from GitHub UI

jobs:
  sync-standards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Differential Scraper & Qdrant Indexer
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          python scrapers/scraper_sync.py

      - name: Commit Updated PDFs and Manifest to GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto(sync): Update PDF standards & manifest hashes"
          file_pattern: "pdf_store/*"